<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Viance 4/7 1.0.98</title>
  <link rel="shortcut icon" type="image/png" href="./assets/favicon-CiX55uzs.png" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <script src="https://unpkg.com/konva@9/konva.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/interactjs@1.10.11/dist/interact.min.js"></script>
  <style>
body {
    overflow: hidden; /* Ẩn scrollbar */
    margin: 0; /* Xóa margin mặc định của body */
    background-color: #e7f1ff;
    transition: background-color 180ms ease-in-out;
  }

  body[data-voice-state="reading"] {
    background-color: #fff3cd;
  }

  body[data-voice-state="listening"] {
    background-color: #d1e7dd;
  }

  body[data-voice-state="received"] {
    background-color: #fff3cd;
  }

  body[data-voice-state="processing"] {
    background-color: #cfe2ff;
  }

  body[data-voice-state="error"] {
    background-color: #f8d7da;
  }
  #konva-canvas {
    width: 100vw; /* Chiều rộng 100% của viewport */
    height: 100vh; /* Chiều cao 100% của viewport */
  }

  .setting-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 10;
    }

    .home-btn {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 10;
    }

    .zoom-controls {
      position: absolute;
      top: 45px;
      /* Adjust this value to position it below the setting button */
      right: 10px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      /* Arrange buttons in a column */
      gap: 3px;
    }

    .voice-status {
      position: absolute;
      left: 50%;
      top: min(calc(50% + 210px), calc(100vh - 100px));
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 10px;
      box-sizing: border-box;
      width: min(360px, calc(100vw - 24px));
      padding: 14px 22px;
      border-radius: 999px;
      color: #fff;
      background: rgba(33, 37, 41, 0.88);
      transform: translateX(-50%);
      justify-content: center;
      font-size: 21px;
      font-weight: 700;
      pointer-events: none;
    }

    .voice-status-icon {
      font-size: 42px;
      line-height: 1;
    }

    .voice-status.listening {
      background: rgba(25, 135, 84, 0.95);
      box-shadow: 0 0 0 8px rgba(25, 135, 84, 0.2), 0 6px 18px rgba(0, 0, 0, 0.25);
    }

    .voice-status.received {
      background: rgba(255, 193, 7, 0.96);
      color: #212529;
      box-shadow: 0 0 0 8px rgba(255, 193, 7, 0.2), 0 6px 18px rgba(0, 0, 0, 0.2);
    }

    .voice-status.listening .voice-status-icon {
      animation: microphone-pulse 1s ease-in-out infinite;
    }

    .voice-status.error {
      background: rgba(220, 53, 69, 0.95);
    }

    .voice-status.processing {
      background: rgba(13, 110, 253, 0.95);
    }

    @keyframes microphone-pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.25); opacity: 0.65; }
    }

    @media (prefers-reduced-motion: reduce) {
      body {
        transition: none;
      }

      .voice-status.listening .voice-status-icon {
        animation: none;
      }
    }

  </style>
  <script type="module" crossorigin src="./assets/math-D2ICNsxF.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/modulepreload-polyfill-B5Qt9EMX.js">
</head>
<body data-voice-state="processing">

  <a href="app.html" class="btn btn-success home-btn btn-sm" >
    <i class="bi bi-house-check"></i> 
  </a>

  <button id="setting" class="btn btn-primary setting-btn btn-sm" data-bs-toggle="modal" data-bs-target="#settingsModal"><i class="bi bi-gear"></i></button>
  

  <div id="konva-canvas"></div>

  <div id="voice-status" class="voice-status processing" role="status" aria-live="polite">
    <i id="voice-status-icon" class="bi bi-hourglass-split voice-status-icon" aria-hidden="true"></i>
    <span id="voice-status-label">Đang chuẩn bị...</span>
  </div>

   <!-- Zoom Controls -->
   <div class="zoom-controls">
      <button id="reboot-app" class="btn btn-warning btn-sm">
        <i class="bi bi-bootstrap-reboot"></i>
      </button>
    </div>


     <!-- Settings Modal -->
  <div class="modal fade" id="settingsModal" tabindex="-1" aria-labelledby="settingsModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h3 class="modal-title" id="settingsModalLabel">Select level</h3>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">

          <div class="form-check">
            <input class="form-check-input" type="radio" name="options_math_type" id="math_type_1" value="1">
            <label class="form-check-label" for="math_type_1">
              Phép Cộng trừ
            </label>
          </div>
          <div class="card" style="width: 100%;">
            <div class="card-body">
              <div class="form-check">
                <input class="form-check-input" type="radio" name="options_plus" id="radio_pv_10" value="10" checked>
                <label class="form-check-label" for="radio_pv_10">
                  Phạm vi 10
                </label>
              </div>
              <div class="form-check">
                <input class="form-check-input" type="radio" name="options_plus" id="radio_pv_100"  value="100">
                <label class="form-check-label" for="radio_pv_100">
                  Phạm vi 100
                </label>
              </div>
            </div>
          </div>

          <br>
          <div class="form-check">
            <input class="form-check-input" type="radio" name="options_math_type" id="math_type_2" value="2" checked>
            <label class="form-check-label" for="math_type_2">
              Chọn phép toán
            </label>
          </div>
          <div class="card mb-2">
            <div class="card-body py-2">
              <div class="form-check">
                <input class="form-check-input" type="radio" name="multiplication_operation" id="operation_both" value="both" checked>
                <label class="form-check-label" for="operation_both">Cả nhân và chia</label>
              </div>
              <div class="form-check">
                <input class="form-check-input" type="radio" name="multiplication_operation" id="operation_multiply" value="multiply">
                <label class="form-check-label" for="operation_multiply">Chỉ phép nhân</label>
              </div>
              <div class="form-check">
                <input class="form-check-input" type="radio" name="multiplication_operation" id="operation_divide" value="divide">
                <label class="form-check-label" for="operation_divide">Chỉ phép chia</label>
              </div>
            </div>
          </div>
          <div class="input-group flex-nowrap">
            <select id="multi-dropdown" class="form-select" aria-label="Chọn bảng cửu chương">
              <option value="all" selected>Bảng từ 2 đến 9 (ngẫu nhiên)</option>
              <option value="2">Bảng 2</option>
              <option value="3">Bảng 3</option>
              <option value="4">Bảng 4</option>
              <option value="5">Bảng 5</option>
              <option value="6">Bảng 6</option>
              <option value="7">Bảng 7</option>
              <option value="8">Bảng 8</option>
              <option value="9">Bảng 9</option>
            </select>
          </div>    

          <br>
          <h5 class="card-title">Thời gian trả lời</h5>
          <div class="input-group flex-nowrap">
            <select id="duration-dropdown" class="form-select">
              <option value="3" >3 Giây</option>
              <option value="5">5 Giây</option>
              <option value="8">8 Giây</option>
              <option value="10" selected>10 Giây</option>
            </select>
          </div>

          <br>
          <h5 class="card-title">Giọng đọc</h5>
          <div class="input-group flex-nowrap">
            <select id="voice-dropdown" class="form-select" aria-label="Chọn giọng đọc tiếng Việt">
              <option value="auto" selected>Tự động chọn giọng nữ</option>
            </select>
          </div>

          <div class="modal-footer">
            <button type="button" id="id_close_modal" class="btn btn-primary" >OK</button>
          </div>

        </div>
      </div>
    </div>
  </div>


</body>
</html>
